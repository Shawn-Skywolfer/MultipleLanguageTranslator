name: PDF and Skill verification
on:
  pull_request:
    paths: ['app.js', 'pdf-overlay.js', 'tools/**', 'skills/**', 'tests/**', '.github/workflows/pdf-skill.yml']
  push:
    branches: [main]
    paths: ['app.js', 'pdf-overlay.js', 'tools/**', 'skills/**', 'tests/**', '.github/workflows/pdf-skill.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - run: python -m pip install -r tools/requirements-pdf.txt
      - run: npm test
      - run: python tests/pdf-cli.test.py
      - run: python tests/translation-batches.test.py
      - name: Install PDF integration test dependencies
        run: npm install --prefix "$RUNNER_TEMP/pdf-overlay-deps" --ignore-scripts --no-audit --no-fund pdf-lib@1.17.1 @napi-rs/canvas@0.1.100 pdfjs-dist@3.11.174
      - name: Browser PDF core integration
        env:
          NODE_PATH: ${{ runner.temp }}/pdf-overlay-deps/node_modules
        run: python tests/pdf-browser.test.py
      - name: Check distributed source consistency
        run: |
          cmp app.js skills/document-translate/assets/workbench/app.js
          cmp pdf-overlay.js skills/document-translate/assets/workbench/pdf-overlay.js
          cmp tools/pdf_translate.py skills/document-translate/scripts/pdf_translate.py
          cmp tools/translation_batches.py skills/document-translate/scripts/translation_batches.py
